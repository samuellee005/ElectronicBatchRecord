# Postgres credentials live in .env (EBR_PG_HOST/USER/PASSWORD).
# Logins are checked against `db_user`; EBR_LOGIN_BYPASS_DB=1 (local only)
# lets any username sign in without that table.
services:
  ebr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebr-app:latest
    container_name: ebr-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Real logins: users come from the enterprise `db_user` table and the
      # password is verified against the stored value. Needs
      # `GRANT SELECT ON public.db_user TO ebr;` on the deployment database.
      # Local dev has no db_user — docker-compose.local.yml turns bypass back on.
      EBR_REQUIRE_PASSWORD: "1"
      # Role is not a column in db_user — these usernames get admin in the UI.
      EBR_ADMIN_USERNAMES: "dmurphy,slee"
      # Inter-container DNS — reaches pdf-detect over the compose network.
      EBR_PDF_DETECT_URL: "http://pdf-detect:8000"
      # Selects database db4 (see ebr_resolve_pg_database in includes/db.php);
      # without it the app silently falls back to `dev`, which has no ebr_* tables.
      # docker-compose.local.yml pins EBR_PG_DATABASE, which takes precedence.
      EBR_DEPLOYMENT: "arcturus"
    depends_on:
      - pdf-detect
    ports:
      - "127.0.0.1:8080:8080"

  pdf-detect:
    build:
      context: ./pdf_field_service
      dockerfile: Dockerfile
    image: ebr-pdf-detect:latest
    container_name: ebr-pdf-detect
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
