; Match config.php MAX_FILE_SIZE (10MB) with headroom for multipart overhead.
upload_max_filesize = 12M
post_max_size = 12M

; Never print PHP warnings into responses: the API speaks JSON, and one stray
; warning ahead of it makes the browser unable to read the reply ("Unknown
; error"). Log them to stderr instead, where `docker logs ebr-app` shows them.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Headroom for large forms. Requests should not need it: form listings and
; saves read only summary columns (see EBR_FORMS_SUMMARY_COLUMNS).
memory_limit = 256M
